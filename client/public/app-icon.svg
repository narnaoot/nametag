<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Nametag app icon">
  <defs>
    <!-- faint halftone dot texture -->
    <pattern id="halftone" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="21" cy="21" r="2.1" fill="#FFFFFF" opacity="0.25"/>
    </pattern>
    <!-- sticker rounded-rect clip -->
    <clipPath id="sticker">
      <rect x="86" y="106" width="340" height="300" rx="26"/>
    </clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#143028" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- teal field (iOS masks its own corners; rx is for web/standalone preview) -->
  <rect width="512" height="512" rx="115" fill="#06D6B8"/>
  <rect width="512" height="512" rx="115" fill="url(#halftone)"/>

  <!-- the sticker, tilted -4° -->
  <g transform="rotate(-4 256 256)" filter="url(#lift)">
    <g clip-path="url(#sticker)">
      <rect x="86" y="106" width="340" height="300" fill="#FFFBF5"/>
      <rect x="86" y="106" width="340" height="142" fill="#3D2B1F"/>
    </g>
    <text x="256" y="196" text-anchor="middle"
          font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="900"
          font-size="68" letter-spacing="-2" fill="#FFFBF5">hello</text>
    <text x="256" y="228" text-anchor="middle"
          font-family="'Nunito', system-ui, sans-serif" font-weight="800"
          font-size="17" letter-spacing="4.4" fill="#FFFBF5" opacity="0.85">MY NAME IS</text>
    <rect x="116" y="300" width="265" height="10" rx="5" fill="#E8DDD0"/>
    <rect x="116" y="330" width="177" height="10" rx="5" fill="#E8DDD0"/>
  </g>
</svg>
