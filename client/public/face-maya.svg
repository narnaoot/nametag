<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Maya">
  <rect width="100" height="100" fill="#FCEFE1"/>
  <!-- hair (back) -->
  <path d="M22 50 C22 22 78 22 78 50 L78 84 L66 84 L66 52 C66 33 34 33 34 52 L34 84 L22 84 Z" fill="#4A3526"/>
  <!-- shoulders -->
  <path d="M20 100 C20 80 35 74 50 74 C65 74 80 80 80 100 Z" fill="#F7B7AC"/>
  <!-- neck -->
  <rect x="44" y="59" width="12" height="15" rx="6" fill="#E7AE86"/>
  <!-- head -->
  <ellipse cx="50" cy="45" rx="19" ry="21" fill="#F3CBA4"/>
  <!-- ears -->
  <circle cx="31" cy="46" r="3.4" fill="#F3CBA4"/>
  <circle cx="69" cy="46" r="3.4" fill="#F3CBA4"/>
  <!-- fringe -->
  <path d="M30 42 C30 25 70 25 70 42 C64 33 58 31 50 31 C42 31 36 33 30 42 Z" fill="#4A3526"/>
  <!-- eyes -->
  <circle cx="43" cy="45.5" r="2.3" fill="#3D2B1F"/>
  <circle cx="57" cy="45.5" r="2.3" fill="#3D2B1F"/>
  <!-- blush -->
  <circle cx="38" cy="52" r="3" fill="#F2A9A0" opacity=".6"/>
  <circle cx="62" cy="52" r="3" fill="#F2A9A0" opacity=".6"/>
  <!-- smile -->
  <path d="M44 55 Q50 60 56 55" stroke="#B5654A" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
