<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Theo">
  <rect width="100" height="100" fill="#FCEFE1"/>
  <!-- shoulders -->
  <path d="M20 100 C20 80 35 74 50 74 C65 74 80 80 80 100 Z" fill="#B9A6E6"/>
  <!-- neck -->
  <rect x="44" y="59" width="12" height="15" rx="6" fill="#E7B291"/>
  <!-- head -->
  <ellipse cx="50" cy="45" rx="19" ry="21" fill="#F1CDAA"/>
  <!-- ears -->
  <circle cx="31" cy="46" r="3.4" fill="#F1CDAA"/>
  <circle cx="69" cy="46" r="3.4" fill="#F1CDAA"/>
  <!-- short hair -->
  <path d="M29 41 C29 24 71 24 71 41 C71 33 64 28 50 28 C36 28 29 33 29 41 Z" fill="#6B4A2E"/>
  <!-- glasses -->
  <g fill="none" stroke="#3D2B1F" stroke-width="1.8">
    <circle cx="43" cy="46" r="5.2" fill="#FFFFFF" fill-opacity=".35"/>
    <circle cx="57" cy="46" r="5.2" fill="#FFFFFF" fill-opacity=".35"/>
    <line x1="48.2" y1="46" x2="51.8" y2="46"/>
  </g>
  <!-- eyes -->
  <circle cx="43" cy="46" r="2.2" fill="#3D2B1F"/>
  <circle cx="57" cy="46" r="2.2" fill="#3D2B1F"/>
  <!-- smile -->
  <path d="M45 55 Q50 59 55 55" stroke="#B5654A" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
