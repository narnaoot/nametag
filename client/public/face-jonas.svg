<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Jonas">
  <rect width="100" height="100" fill="#FCEFE1"/>
  <!-- shoulders -->
  <path d="M20 100 C20 80 35 74 50 74 C65 74 80 80 80 100 Z" fill="#EFCB84"/>
  <!-- neck -->
  <rect x="44" y="59" width="12" height="15" rx="6" fill="#8C5330"/>
  <!-- head -->
  <ellipse cx="50" cy="45" rx="19" ry="21" fill="#A6683C"/>
  <!-- ears -->
  <circle cx="31" cy="46" r="3.4" fill="#A6683C"/>
  <circle cx="69" cy="46" r="3.4" fill="#A6683C"/>
  <!-- curly short hair -->
  <g fill="#241C18">
    <circle cx="34" cy="30" r="7"/>
    <circle cx="44" cy="26" r="7.5"/>
    <circle cx="55" cy="26" r="7.5"/>
    <circle cx="65" cy="30" r="7"/>
    <circle cx="30" cy="38" r="5.5"/>
    <circle cx="70" cy="38" r="5.5"/>
  </g>
  <!-- eyes -->
  <circle cx="43" cy="46" r="2.3" fill="#1E1712"/>
  <circle cx="57" cy="46" r="2.3" fill="#1E1712"/>
  <!-- smile -->
  <path d="M44 55 Q50 60 56 55" stroke="#5E3A22" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
