services:
  - type: web
    name: nametag-api
    runtime: node
    plan: free
    buildCommand: npm install
    # Run node directly (not via npm) so the stop signal reaches the server and
    # its shutdown sweep runs — see server/index.js.
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        sync: false       # paste your Neon/Supabase URL in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
