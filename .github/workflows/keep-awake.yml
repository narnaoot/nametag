# Keeps the API awake so its privacy clean-up actually runs on time.
#
# The server deletes a tag 30 minutes after its owner leaves (server/cleanup.js).
# That sweep is a timer inside the API process, and Render's free plan stops the
# process after ~15 quiet minutes — so without this, the delete would wait for
# the next visitor. A request every 5 minutes keeps the process running. If the
# server has gone to sleep anyway, this request wakes it and the sweep runs on
# startup.
#
# Notes:
#  - GitHub may run scheduled jobs a few minutes late; 5 minutes leaves slack.
#  - GitHub switches scheduled workflows off after 60 days with no commits to
#    the repo. It emails first; re-enable it from the Actions tab.
#  - Not needed on an always-on (paid) Render instance — delete this file then.
name: Keep API awake

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the health endpoint
        # A sleeping instance takes up to a minute to answer, so allow for it.
        run: |
          curl --fail --silent --show-error \
               --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
               https://nametag.onrender.com/api/health
